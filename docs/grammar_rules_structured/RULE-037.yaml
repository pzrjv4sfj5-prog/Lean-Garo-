id: RULE-037
title: "`a'`/`an'`/`am'` Compound Prefix (Distinct from Raka)"
description: >-
  A productive prefix, orthographically an apostrophe ('), distinct
  from raka (·) - confirmed structurally different, not a typo variant
  of raka. Semantically clustered: a'-prefixed forms cluster around
  land/earth/place senses (a'gil·sak="earth", a'ki·sang="bottom of a
  field", a'mal="boundary between two fields", a'ging="dry land",
  a'gi·si="desert"); an'/am'-prefixed forms cluster around blood/body
  senses (an'chi kam·a="blood blister", an'chi ja·dil="blood vessel",
  an'chin·ek="bodily impurities"). Co-occurs with raka in the same
  word without conflict (a'jak sok·gipa="avenger" - both marks
  present).
dependencies:
  - id: RULE-001
    name: "Raka Locality"
    note: "this rule exists specifically to keep this prefix from being mistaken for a raka variant, per the exact confusion RC-CANDIDATE-012's investigation raised"
claims:
  - scope: "the prefix is real and distinct from raka"
    status: verified
    confidence: high
    confidence_note: "very high confidence given 91 non-random, semantically-clustered instances plus independent corroboration"
  - scope: "the precise grammatical function and exact semantic scope of a' vs. an'/am'"
    status: needs_native_validation
    confidence: medium
    status_note: >-
      the land/earth vs. blood/body clustering is Claude A's own
      observation from the data, not a native claim - no direct
      Thangseng confirmation of the prefix's grammatical
      function/exact semantic boundary yet.
examples:
  - "a'jak soka=\"to take revenge\" (independently confirmed from a separate primary source, suffixes.pdf's compound-verb section)"
  - "a'jak sok·gipa=\"avenger\" (same root + agentive -gipa, RULE-015 stem formation applies normally)"
counterexamples:
  note: >-
    the isolated "sad"/"bright" duplicate-entry typos (RC-CANDIDATE-012)
    are explicitly NOT members of this pattern - no semantic
    clustering, no productive compounding, a duplicate correct-form
    exists alongside the typo (unlike any of these 91 entries, which
    have no alternate raka-marked form).
  items: []
launch_priority:
  - scope: null
    tier: P1
    note: >-
      not launch-blocking (mostly low-frequency nature/culture
      vocabulary), but resolves RC-CANDIDATE-012's scope-boundary
      question definitively: leave all 91 entries untouched, they are
      not part of that bug.
native_notes: >-
  91 master_dictionary.json entries found via direct search
  (2026-07-13, Claude A review of Claude B's flagged boundary
  question); a'jak soka independently corroborated from suffixes.pdf.
last_updated: "2026-07-26"
updated_by: "Claude A"
