id: RULE-023
title: "`-gen` (Future) Never Carries Raka"
description: >-
  The future suffix `-gen` never triggers or carries raka, regardless
  of the root it attaches to — a specific, testable claim distinct
  from RULE-001's general locality principle.
dependencies:
  - id: RULE-001
    name: "Raka Locality"
    note: null
  - id: RULE-015
    name: "Stem Formation"
    note: null
claims:
  - scope: null
    status: verified
    status_note: "The raka-bearing-root test case this rule's confidence_note called for is now in hand: 'cha·gen' (root cha·a, which carries its own raka) confirmed 2026-08-13 via Project Owner relay ('Angaba cha·gen'='I will also eat'). The root's raka is retained (cha· survives stem formation) but -gen itself adds no NEW raka boundary — this distinguishes \"raka actively suppressed\" from \"never had raka\" as the confidence_note requested."
    confidence: high
    confidence_note: "Two independent example classes now support this: a raka-free root (bilakgen) showing no raka appears, and a raka-bearing root (cha·a -> cha·gen) showing the root's own raka is preserved but the suffix attaches with none of its own. Together these confirm -gen never carries/triggers raka, rather than merely surfacing on already-raka-free roots."
examples:
  - 'bilakgen="will be strong" (root bilak, no raka on the suffix); general pattern across future-tense forms'
  - "cha·gen=\"will eat\" (root cha·a, which itself carries raka) — confirmed 2026-08-13 via \"Angaba cha·gen\"=\"I will also eat\". The root's raka survives stem formation (cha· from cha·a); -gen adds none of its own."
counterexamples:
  note: "none recorded"
  items: []
launch_priority:
  - scope: null
    tier: P1
native_notes: "Source Rule 23, GRAMMAR_SPEC.md."
last_updated: "2026-08-13"
updated_by: "Claude A"
source_ref: "docs/GRAMMAR_RULE_CATALOGUE.md, ### RULE-023"
