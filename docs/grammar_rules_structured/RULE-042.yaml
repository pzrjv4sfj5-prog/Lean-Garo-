id: RULE-042
title: "`-de` Temporal Suffix (\"at that time\")"
description: >-
  `-de` attaches to day/time words and means roughly "at that time."
  Confirmed across all three tenses via three minimally-contrastive
  sentences with the same frame ("[time]-de, [will/did] go to the
  market"):
  - Knal ("tomorrow") + -de → Knalde bajalchi re·anggen = "Tomorrow (I)
    will go to the market."
  - Da·al ("today") + -de → Da·alde bajalchi re·anggen = "Today (I)
    will go to the market."
  - Mijal/Mejal ("yesterday") + -de → Mijalde bajalchi re·anga =
    "Yesterday (I) went to the market."
  - Also confirmed with a clock time, not just relative day words:
    10:00 am bajiode bajalchi re·anggen = "At 10:00 am (I) will go to
    the market" (bajio = "o'clock"/time-of-day + -de).

  Semantic nuance beyond "at that time," per Thangseng: it carries the
  sense that of all the things happening, this particular thing will
  be/was done at the specified time - can imply something else was
  planned but couldn't happen, so this will happen at the stated time
  instead. Not a neutral time-stamp; closer to a contrastive/emphatic
  temporal focus.
dependencies:
  - id: null
    name: "the chi destination-locative (confirmed NV-022)"
    note: "in bajalchi = Bajal (\"market\") + chi - the -de suffix and -chi locative co-occur without conflict in the same sentence, consistent with how other suffix stacking has worked elsewhere in this grammar"
claims:
  - scope: null
    status: verified
    confidence: high
examples:
  - "see description above - Knalde, Da·alde, Mijalde, and a clock time (bajiode), all confirmed"
