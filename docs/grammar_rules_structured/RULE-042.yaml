native_notes: >-
  direct Thangseng relay, 2026-07-23, via Project Owner: "Knalde
  bajalchi re·anggen. = Tomorrow (I) will go to the market. Da·alde
  bajalchi re·anggen. = Today (I) will go to the market. Mijalde
  bajalchi re·anga. = Yesterday (I) went to the market. The de suffix
  essentially conveys the idea that of all the things this particular
  thing will be done at the specified time. It can also imply that
  maybe something had been planned but could not be done... It can
  also be used with time. Example: 10:00 am bajiode bajalchi
  re·anggen."
