id: RULE-030
title: "`re·` vs. `re·ang` for \"Go\" [RESOLVED]"
description: >-
  Two forms of "go" coexist in confirmed data. Update 2026-07-18
  (direct Thangseng answer to NV-001): the destination-presence
  hypothesis this rule was built around is confirmed wrong as the
  primary conditioning factor. Thangseng: "No, the form depends
  primarily on the mood and the tense. Apart from those the negative
  suffix also affects the form." Separately confirmed: -ang genuinely
  functions as an "away from me" directional marker - but only in
  composition with re·a ("to walk"/"to go") specifically, not as a
  general directional affix. Treat -ang as carrying a real but narrow,
  lexically-scoped sense tied to this one verb family - not a
  productive general prefix (same homonymy-adjacent caution pattern as
  ama).
dependencies: []
claims:
  - scope: "destination presence/absence's effect on verb form (mood/tense/negation as the complete conditioning factor)"
    status: verified
    confidence: high
    status_note: >-
      Final confirmation, 2026-07-25: direct answer to three matched
      pairs (bare vs. destination-bearing "not going," "did not go"):
      "The verb form has virtually nothing to do with the destination.
      Verb form is concerned with the mood and the tense." The
      examples that appeared to correlate with destination presence
      were coincidental, not causal.
  - scope: "the -jaha/-ja gloss confusion (whether \"Ua re'angjaha\" means \"he did not go\" or \"he stopped going\")"
    status: needs_native_validation
    confidence: high
    status_note: >-
      RECONCILED 2026-07-26 via existing verified rules, not new
      native data: RULE-025 (cessative -jaha, Verified/High) already
      documents exactly this error pattern - -jaha means "was doing,
      has now stopped," not "did not." So "Ua re'angjaha" almost
      certainly means "he stopped going," and "Ua re'angja" (RULE-027,
      no -ha, engine-verified) is the real "did not go." Confident in
      the reasoning, but a direct native check on "Ua re'angjaha"
      specifically would make this fully certain rather than strongly
      inferred - added to next relay as a quick confirmation, not
      treated as fully closed.
examples:
  - >-
    Re·jawa = "I will not go" (bare, no destination) — derivation
    confirmed directly, 2026-07-26: re·a ("to go") → re· (bare root,
    per RULE-015 stem formation) → re· + jawa = re·jawa.
  - 'Hai re·naha = "let''s go" (bare, no destination)'
  - 'Anga re''angjaenga = "I am not going" (no destination)'
  - 'Anga antichi re''angjaenga = "I am not going to the market" (destination present, same continuous-negative form either way)'
  - 'Ua re''angja (not re''angjaha) = "he did not go" — corrected 2026-07-26'
  - 'Contrast: Re·anga=go, re·angenga=going, Dokanchi re·angbo=go to the shop, nokchi re·anggen="will go home now", Antichi re·angbo="go to the market" (imperative)'
counterexamples:
  note: "N/A"
  items: []
launch_priority:
  - scope: null
    tier: P0
    note: >-
      high-frequency verb. corrections.json's narrow patch
      generalized 2026-07-25 (Claude B) — findVerbForm('go') was
      returning the wrong root for negative-future tense on any
      subject not already covered by the literal correction; fixed
      with a scoped exception at the negative-future call site in
      analyzeGrammar. Verified across all subject pronouns.
native_notes: >-
  Source Rule 30 (THANGSENG_RULES_LOOKUP.md), flagged 2026-07-05.
  Direct NV-001 answer received 2026-07-18 (mood/tense/negation as
  primary conditioners; -ang scope narrowed to re·a specifically).
  Final confirmation 2026-07-25: destination presence/absence has
  virtually no effect on verb form in either direction, direct
  minimal-pair test. re·jawa derivation confirmed 2026-07-26. See
  docs/THANGSENG_NATIVE_VALIDATION.md NV-001.
corrections:
  - date: "2026-07-26"
    note: >-
      The two re'angjaha examples previously glossed "he did not go" /
      "he did not go to the market" are corrected, not just reworded -
      see claim 2 above. re'angjaha examples relocated/reinterpreted
      as the cessative sense per RULE-025, not deleted.
  - date: "2026-08-28"
    note: >-
      FLAGGED TENSION, not resolved (Project Owner direct chat relay,
      session 2): a direct answer to the bare dictionary key "go" gave
      "re'a", conflicting with this rule's own established example
      "Re·anga=go". Same relay also gave "will not go"=re'angjawa,
      conflicting with this rule's "Re·jawa = 'I will not go' (bare, no
      destination)" example. Both new forms are recorded as new
      VERIFIED/HIGH master_dictionary.json rows (english="go" and
      english="will not go"), NOT used to silently overwrite this
      rule's examples or shipped runtime values. Possible explanation
      consistent with this rule's own finding (mood/tense/negation as
      the conditioning factor, not destination) — a register or
      mood distinction between the bare re·a/re·jawa forms and the
      re·ang-stem forms — but this is speculation, not confirmed.
      Needs an explicit future relay question contrasting the two
      pairs directly before either is promoted to override the other.
      RUNTIME CONFIRMATION (2026-08-28, same session): attempted
      setting phrase_maps.js's 'go' root to 're·a' to match the new
      relay — broke 4 live regression tests ("going", "will go", "he/i
      did not go") because findVerbForm('go') feeds stem derivation
      for all conjugated forms via the existing re·ang- stem system.
      Reverted; engine root stays 'Re·anga'. This confirms the
      standing re·ang- stem system is correct for conjugation, and
      narrows the open question to just the bare/citation-form "go"
      itself, not the conjugation paradigm.
  - date: "2026-08-30"
    note: >-
      RESOLVED (NV-100, direct Thangseng relay via Project Owner/Tridip,
      session following the 2026-08-28 flag): Thangseng gave the full
      paradigm unprompted. "Re.a = to walk; re.anga = went" — re·a is the
      root/infinitive ("to walk"), re·anga is derived from it and glosses
      as the past tense "went", not bare "go" as this rule's own example
      list had it. For the negative-future pair: "Re.jawa = will not go"
      and "Re.angjawa = will not be going" — Thangseng explicitly
      recommended translating re·angjawa as "will not be going" rather
      than "will not go", "to avoid confusion, and for better rendering".
      These are NOT competing synonyms for one meaning as the 2026-08-28
      note speculated — they are two distinct English senses (simple vs.
      continuous/progressive negative future), each independently
      correct. master_dictionary.json updated: the "will not go"=
      re·angjawa row relabeled to english="will not be going" (same garo
      value, key corrected per direct native guidance); new clean rows
      added for "will not go"=re·jawa (resolves the pre-existing
      corrections.json orphan), "to walk"=Re·a, and "went"=Re·anga. The
      bare-citation-form "go" row (re·a, 2026-08-28) is clarified but not
      fully closed — Thangseng's paradigm doesn't directly re-answer
      whether "go" in isolation is best represented by re·a or re·anga;
      left as its own open note on that row. Engine root unchanged
      (Re·anga stays the re·ang- stem/conjugation root per the
      2026-08-28 regression-test finding — this relay doesn't touch
      that). See docs/THANGSENG_NATIVE_VALIDATION.md NV-100.
