  - "Tegatchu minengha. = The mangoes have started ripening."
  - "Tegatchu minkuja. = The mangoes are not ripe / have not started ripening."
  - "Tegatchu minenga. = The mango is ripening. / The mango is ripe."
  - "Ua te·gatchu minenga. = That mango is ripe."
