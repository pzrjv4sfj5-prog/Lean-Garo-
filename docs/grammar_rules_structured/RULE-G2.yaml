  # open by that single example. Splitting preserves both as separate,
  # separately-confidence-rated claims rather than one blended status.
  - scope: "the confirmed example itself (locative phrase clustering before the verb, this specific sentence)"
    status: verified
    confidence: high
  - scope: "general productivity across arbitrary locative+verb combinations"
    status: needs_native_validation
    status_note: "not yet stress-tested - see Grammar Specification §2. Source phrasing implies untested/unconfirmed, not actively disconfirmed - treat as open, not as a known problem."
    confidence: medium
examples:
  - 'Achak tebil nokkimao ong·a = "the dog is under the table" (locative phrase tebil nokkimao clusters before ong·a)'
