id: RULE-G2
title: "Pre-verbal Clustering (Locative Phrases)"
description: >-
  Locative phrases, classifier+number phrases, and other adjunct
  material cluster before the verb in SOV order, consistent with
  RULE-003.
dependencies:
  - id: RULE-003
    name: "SOV Word Order"
    note: null
  - id: RULE-033
    name: "Locative \"Under\""
    note: null
