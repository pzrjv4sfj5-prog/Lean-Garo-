id: RULE-049
title: "bi·sa — Productive Child/Young-One Marker"
description: >-
  bi·sa means kid/child/baby/young-one and composes productively across
  categories (human and animal) to derive "young X" compounds. It is a
  meaningful semantic contribution, not a redundant or droppable element,
  and must never be stripped from a compound merely to simplify an
  English gloss (e.g. collapsing "little boy" -> "boy").
dependencies: []
claims:
  - scope: "bi·sa as productive young-one marker (human + animal)"
    status: verified
    confidence: high
    source: "Project Owner directive, 2026-09-08 — AGENT_A_B_C_LANGUAGE_ENGINEERING_HANDOFF_20260908.json non_negotiable_rules + child_marker block"
open_questions:
