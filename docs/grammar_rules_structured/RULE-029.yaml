id: RULE-029
title: "Imperative `-bo` (never hortative); `Hai` + `-bo` = urging"
description: >-
  `-bo` is strictly imperative: a command to someone else (Cha·bo = eat!).
  It never means "let's". The hortative (speaker included) is Hai + verb
  root + `-na` (Hai cha·na = let's eat). Hai + `-bo` is urging, still
  directed at the listener (Hai cha·bo = come on, eat / go and eat).
  Rewritten 2026-10-19 (NV-173, Project Owner-provided answers); replaces
  the earlier claim that one suffix served both imperative and hortative
  functions.
dependencies:
  - id: RULE-003b
    name: null
    note: null
claims:
  - scope: "-bo is strictly imperative (command to another person), never 'let's'"
    status: po_provided
    confidence: high
    status_note: "NV-173, Project Owner-provided 2026-10-19; consistent with NV-165 (Hai cha·bo = go and eat, Thangseng final validation relayed by the Project Owner) and NV-166. Not a direct native quote."
  - scope: "Hai + -bo = urging (come on / go ahead), directed at the listener; Hai + -na = hortative"
    status: verified
    confidence: high
    status_note: "Hai cha·bo / Hai cha·na split from NV-165; Hai re·bo = go on, go is Project Owner-provided (NV-173), not natively attested."
  - scope: "-bo takes the same form for one listener or many"
    status: verified
    confidence: medium
    status_note: "NV-173 (Project Owner-provided) then confirmed by NV-178 (2026-10-20, Project Owner-relayed answer attributed to Thangseng; raw message not on file): Garo verbs do not change with the number of listeners. Do not generate any singular/plural -bo distinction."
examples:
  - 'Sengbo = "stop!" (imperative)'
  - 'Biko sandibo = "search for him!" or "look for him" (imperative, order to the listener; NV-170, NV-173)'
  - 'Hai sakprak Agana skiebo = "come on, practice speaking!" (urging imperative to the listeners; NV-178)'
  - 'Hai cha·bo = "go and eat" (urging, also "come on, eat"; not "let''s eat")'
counterexamples:
  note: "none confirmed; the legacy 'let us practice garo together' gloss for Hai sakprak Agana skiebo was wrong and is superseded (NV-178)"
  items: []
