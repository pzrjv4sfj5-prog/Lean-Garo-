id: RULE-038
title: "Counting Construction: Noun + Classifier-Number"
description: >-
  Garo counting phrases follow Noun + Classifier-Number, not a bare
  number word. The specific noun is always stated, followed by a
  classifier root selected by the noun's semantic class, fused with a
  number suffix (sa=1, gni=2, gittam=3...). Classifier roots confirmed
  so far via direct native citation: mang (animals/birds/fish, NO raka
  dot before a single-digit suffix, dot:false confirmed 2026-09-18/19
  after two prior reversals -- see native_notes), sak (people, no raka
  dot before the number), king (books/flat objects -- engine composition
  treats king as no-dot per 2026-09-19 Owner directive, but 10 existing
  verified_high dictionary rows for "one book".."ten books" still ship
  WITH the dot; unresolved, see native_notes CONTRADICTION note, do not
  resolve without a fresh citation), gong (money/currency, WITH raka dot,
  confirmed 2026-09-18), rong (roundish objects - fruits, alcohol, no
  dot), ge (general objects/tools/furniture/containers - NOT fruit,
  corrected 2026-08-01, WITH dot), and te (houses - added 2026-09-12,
  WITH dot, see native_notes).
  Additionally, the 2026-09-10/11 Project Owner-supplied
  data/garo_number_classifier_engine_machine_ready.json contract adds a
  further confirmed set for other categories (pang=trees/plants, dot=
  logs/bamboo/mountains, dam=villages, roa=roads/length, jol=poles/rods,
  bol=cars, akka=banana bunches, plus measurement units kg/litre/plate/
  se) - not yet folded into this rule's examples list in full, see that
  file directly for the complete current table. Project Owner has
  explicitly instructed this be treated as a standing rule, not a
  one-off observation. Full category-by-category classifier list
  requested from Thangseng 2026-07-21, not yet fully answered - do not
  assume the roots above are the complete set.
dependencies:
  - id: RULE-015
    name: "Stem Formation"
    note: "may interact for classifier-suffix behavior, unconfirmed"
claims:
  - scope: "the 5 classifier roots and examples listed"
    status: verified
    confidence: high
    confidence_note: "given 5 independently-corroborated classifier roots; rong corroborated by 2 examples only (medium evidence within a high-confidence rule), see native_notes"
  - scope: "completeness of the classifier-root inventory (remaining classifier categories - materials, objects generally, etc.; and whether classifier choice ever varies by dialect/register)"
    status: needs_native_validation
    confidence: low
    status_note: "Thangseng was asked for the full list 2026-07-21; 2026-08-01 relay answered rong (roundish objects, incl. alcohol) but did not confirm the list is now complete - still awaiting full confirmation"
examples:
  - "achak mangsa=\"one dog\", achak manggni=\"two dogs\""
  - "do·o manggni=\"two chicken\" (do·o=\"chicken\", NOT a number or generic animal word — see RC-CANDIDATE-022/NV-025 for the corruption this caused when the noun was dropped)"
  - "na·tok manggittam=\"three fish\""
  - "manderang saksa=\"one person\", skigipa sakgni=\"two teachers\" (sak takes NO raka dot before the number suffix — corrected 2026-09-03, see NV-124; RE-CONFIRMED 2026-09-28 direct Project Owner statement in chat, no change to data or code needed, engine already shipped this correctly. Note: unlike gong/ge/te, which DO take the dot -- mang and king do NOT take the dot either, despite this example's older wording; see native_notes)"
  - "ki·tap king·sa=\"one book\", ki·tap king·gittam=\"three books\""
  - "kettal ge·gni=\"two knives\""
  - "do·o mangchiking=\"ten birds\" (CORRECTED 2026-09-28: prior wording cited \"do·a\", which is only a superseded/stale master_dictionary.json row; the current verified_high row for \"ten birds\" is do·o, the same word already used for \"chicken\" elsewhere in this rule -- the do·a/do·o \"real minimal pair\" claim is CONTRADICTED by current data and needs native re-validation, not asserted here; see native_notes)"
  - "mewa rongbri=\"four fruits\" (rong, no raka — corrected 2026-08-01, was wrongly ge)"
  - "chu rong sa=\"one alcohol\", chu rong bonga=\"five alcohol\" (rong extends to alcohol; chu=\"alcohol\", covers beer/gin/etc; SPACED, corrected 2026-09-13 per direct Owner confirmation -- was previously listed fused as \"chu rongsa\", now understood to be the stale assumption; per-noun exception to rong's otherwise-fused default, see SPACED_NOUNS in garo_classifier.js -- NOT a change to fruit/solid rong nouns like mewa)"
  - "nok te·sa=\"one house\" ... nok te·chiking=\"ten houses\" (te takes the raka dot, like ge/gong (NOT like mang, which is no-dot; king is contested, see native_notes) — full 10-item VERIFIED/HIGH paradigm, native-confirmed 2026-08-13/14, NV-072/NV-075 lineage)"
  - "kolom ge·sa=\"one pen\" ... kolom ge·Chi·chet=\"eighteen pens\" (ge takes the raka dot — full VERIFIED/HIGH paradigm, native-confirmed 2026-08-11)"
counterexamples:
  note: >-
    the pre-existing master_dictionary.json numbers-category entries
    that drop the noun entirely and reuse a single classifier-number
    phrase across unrelated nouns (e.g. the now-fixed do·o manggni
    wrongly standing for "two dogs"/"two birds"/"two fish"
    simultaneously) are the corrupted, NOT the correct form — see
    docs/DICTIONARY_ERROR_AUDIT_20260719.md and RC-CANDIDATE-022 for
    the ~30 collision groups still uncorrected under this same bug
    shape. Also: "mewa ge·bri" for "four fruits" (present in the
    dictionary and this rule's own example list until 2026-08-01) was
    itself an uncorrected error — an unquestioned default-fallback
    guess, not a native-confirmed form. Fixed to "mewa rongbri", see
    NV-048.
  items: []
launch_priority:
  - scope: null
    tier: P0
    note: >-
      this is the root cause of a live, confirmed-wrong translator
      output (RC-CANDIDATE-022, "he has two dogs") and affects the
      entire numbers category (239 entries).
native_notes: >-
  Project Owner relay, 2026-07-20 (the 7-example set above) and
  cross-referenced against master_dictionary.json entries independently
  tagged VERIFIED/HIGH from an earlier session, which agree.
  mande/manderang discrepancy for "person" flagged in NV-025, unresolved
  - do not treat sak's exact noun-form pairing with "person" as fully
  settled. rong classifier: direct Thangseng relay via Project Owner,
  2026-08-01 - "with fruits, rong is the preferred prefix because they
  are roundish in shape, e.g., apple rongsa; te·gatchu rongbonga... and
  for alcohol is rong and in Garo alcohol is chu (new word)". See
  NV-048. NV-124 (2026-09-03): raw WhatsApp transcript from the
  original NV-072/NV-073 relay (2026-08-13, Tridip/Thangseng)
  re-supplied by Project Owner shows "chattro saksa" (student) and
  "mande saksa" (person, "no raka in mande" per Thangseng's own
  annotation) with no dot between sak and the number suffix, while the
  same transcript uses a dot-equivalent character for gong ("tangka
  bisil gong·sa"). This corrects the raka dot previously (and
  incorrectly) inserted into all sak-classifier entries when NV-072/
  NV-073 were first processed. sak now confirmed to take NO raka dot
  before the number suffix, unlike gong (dotted) -- mang and king are
  NOT reliable "does take the dot" comparators either, see below.
  Applied directly
  across all 65 affected sak-classifier entries in
  master_dictionary.json plus 3 children-counting entries in
  corrections.json (Rule 8: fixed directly, not allowlisted).
  ge/te RAKA_CLASSIFIERS question (2026-09-12, closing a
  standing "Owner decisions still open" item from
  CLAUDE_A_SESSION_MIGRATION_20260911B.md): checked whether ge/te in
  src/garo_classifier.js's RAKA_CLASSIFIERS set reflect a real
  confirmed exception or are simply wrong. Both are genuine, richly
  attested: ge has an 18-row VERIFIED/HIGH pen-counting paradigm
  (kolom ge·sa .. ge·Chi·chet, native-confirmed 2026-08-11) plus the
  pre-existing pen/knife/chair examples already in this rule; te has a
  full 10-row VERIFIED/HIGH house-counting paradigm (nok te·sa ..
  te·chiking, NV-072/075 lineage, 2026-08-13/14) that was never folded
  into this rule's example list until now (a documentation gap, not a
  runtime bug — the dictionary rows were always correct). Both take
  the raka dot, same as gong. CORRECTED 2026-09-28: mang does NOT take
  the dot (dot:false, confirmed 2026-09-18/19, see below); king's dot
  status is CONTESTED, not "same as" -- RAKA_CLASSIFIERS excludes king
  by direct 2026-09-19 Owner directive, but 10 existing verified_high
  book-counting rows in master_dictionary.json still ship WITH the dot
  and were never corrected to match. CLOSED for ge/te only; king
  reopened, see the new finding below.
  Space-before-number question (2026-09-12, CORRECTED — retracting
  my own earlier note today): originally closed this as "settled,
  plain space" citing the contract's surface_policy.default_display
  and its confirmed_examples for bol/dot/dam/roa/rong. That was wrong
  — those confirmed_examples were a stale draft assumption predating
  the 2026-08-13 direct Thangseng citations for mountain/village/
  road/car, which are explicitly FUSED with no space (master_
  dictionary.json: "no raka dot (classifier-level property, like
  pang/rong/dot/dam/dil/bol)"). Corrected the contract file to match.
  Actual answer: sak/rong/pang/dot/dam/dil/bol all fuse with no space
  and no raka dot — the engine's existing behavior for these is
  already correct, nothing to change. Water/beer's rong examples
  ("Chi rong sa") remain genuinely unconfirmed, no citation backs
  them.
  sak 40+ fusion generalization (2026-09-12, CLOSED — see NV-157):
  raised the question in docs/THANGSENG_RELAY_QUESTION_20260912.md
  (item 12); Thangseng confirmed same-day the fused sak+tens pattern
  generalizes cleanly past 60, e.g. 71 = Chattro saksotsni sa. Applies
  uniformly through 70s/80s/90s (Sotsni/Sotchet/Sotsku). Worked
  examples added to
  data/garo_number_classifier_engine_machine_ready.json.

finding_20260928: >-
  Claude A, in-chat audit + Claude A resume session, 2026-09-28. Two
  corrections to this rule's own examples, both confirmed against
  master_dictionary.json (no data changed, doc-only): (1) mang's
  examples previously showed the raka dot (mang·sa etc); mang is
  dot:false, confirmed 2026-09-18/19 in src/garo_classifier.js after
  three total reversals -- corrected to mangsa/manggni/etc, matching
  what the engine and the verified_high dictionary rows already ship.
  (2) "ten birds" previously cited "do·a mangchiking" as a "real
  minimal pair" distinguishing do·a=bird from do·o=chicken; the
  verified_high dictionary row for "ten birds" is actually "do·o
  mangchiking" (do·a only survives in a superseded row) -- corrected
  the example and flagged the minimal-pair claim itself as
  data-contradicted, not resolved linguistically here.
  NEW OPEN FINDING (not fixed, needs Owner/native decision, not
  guessed): king's raka-dot status is internally contradictory across
  the codebase. src/garo_classifier.js excludes king from
  RAKA_CLASSIFIERS and lists it dot:false in
  CONFIRMED_COMPOUND_CLASSIFIERS, both sourced to a direct 2026-09-19
  Owner directive ("king doesn't use rakka") and a docx table read as
  consistently undotted. But master_dictionary.json ships 10
  verified_high rows -- "one book" through "ten books" -- all WITH the
  dot (ki·tap king·sa .. king·chiking), never corrected to match the
  2026-09-19 directive. Net effect at runtime: existing book-counting
  phrases resolve WITH a dot (dictionary lookup wins), while any new
  book-like noun composed at runtime would get NO dot (classifier
  engine wins) -- the same classifier produces inconsistent output
  depending on whether the phrase happens to already be in the
  dictionary. Given the documented history of mang/gong/jol/se each
  flipping 2-3 times on this exact question, this is NOT being
  resolved by inference here; it needs one fresh direct citation
  (native or Owner) confirming which is current, then a coordinated
  fix across master_dictionary.json, compiled_dict.json, and this
  rule's own "nok te·sa...(like mang/king/gong/ge)" line. Filed to
  roadmap Phase 2 (data) / Phase 4 (native relay) in
  docs/GRAMMAR_RULE_AUDIT_AND_ROADMAP_20260928.md.

