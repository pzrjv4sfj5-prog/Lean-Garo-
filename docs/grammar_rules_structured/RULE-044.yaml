id: RULE-044
title: "Movement vs. Stationary Locative Suffix Contrast (-chi vs. -o)"
description: >-
  Two locative suffixes contrast on movement: "-chi" marks a locative
  as the goal of movement ("to X"), while "-o" marks a locative with
  no movement implied ("at X"). Given directly by Thangseng as a
  general rule (not inferred from a single example) when asked to
  explain why "bano" and "bachi" both surfaced as candidate forms
  for where-questions. Complements RULE-033/RULE-G2, which establish
  "-o" as a confirmed locative suffix but do not document a movement
  contrast or the "-chi" counterpart.
dependencies:
  - id: RULE-033
    name: "Locative \"Under,\" Retiring a Lexical Confusion"
    note: "establishes -o as a confirmed locative suffix; this rule adds the movement/no-movement contrast RULE-033 doesn't cover"
  - id: RULE-G2
    name: "Pre-verbal Clustering (Locative Phrases)"
    note: "general locative-phrase productivity question this rule offers new corroborating evidence for, without itself resolving it"
claims:
  - scope: "the suffix contrast itself (-chi = movement-to, -o = no-movement locative), as directly stated by Thangseng"
    status: verified
    confidence: high
    status_note: >-
      Upgraded from Medium, 2026-07-31: Project Owner closure
      confirmed all three related forms consistently (Na·a bachi
      re·angenga? = "where are you going?", movement; Na·ara bano? =
      "where are you?", no-movement; Bao = bare "where?"). The
      adjacent NV-047 ambiguity (Na·ara bano? mapping) that had kept
      this at Medium is now resolved, and resolved in the direction
      this rule predicted (bano paired with the stationary question,
      not the movement one) - the closure is corroborating evidence
      for the rule, not just a removal of doubt.
  - scope: "productivity beyond where-question forms (bano/bachi/bao) - does this -chi/-o contrast hold for locatives generally, e.g. beyond interrogatives"
    status: verified
    confidence: high
    status_note: >-
      Upgraded from needs_native_validation, 2026-08-02: direct
      Thangseng relay confirms the contrast holds for ordinary noun
      locatives, not just interrogatives, across five noun pairs
      (market, school, home, river, forest). "chi cannot mean 'at'. chi
      carries a sense of 'motion to'. At is locative 'o'." This closes
      the productivity question this rule and RULE-G2 had left open.
      One residual, non-blocking wrinkle: a pre-existing unannotated
      dictionary entry "at the river"->"chiko" doesn't match the newly
      confirmed "at the river"->"chibimao" - not resolved as an error,
      since "chiko" (chi="water"+-o) may denote a distinct "at the
      water" sense rather than being wrong; flagged in the dictionary
      for future clarification, not blocking this rule's closure.
examples:
  - 'Na·a bachi re·angenga? = "where are you going?" (bachi = movement-to locative, matches the movement verb re·angenga) — CLOSED'
  - 'Na·ara bano? = "where are you?" (bano = -o no-movement locative, stationary question) — CLOSED'
  - 'Bao = "where?" (bare interrogative, no locative suffix) — CLOSED'
  - 'to the market = bajalchi / at the market = bajalo — CLOSED, NV-051'
  - 'to school = skulchi / at school = skulo — CLOSED, NV-051'
  - 'to home = nokchi / at home = noko — CLOSED, NV-051'
  - 'to the river = chibimachi / at the river = chibimao — CLOSED, NV-051'
  - 'to the forest = buringchi / in the forest = buringo — CLOSED, NV-051'
counterexamples:
  note: "none identified"
  items: []
launch_priority:
  - scope: "the confirmed suffix contrast"
    tier: P0
    note: "closed 2026-07-31, dictionary entries corrected same pass"
  - scope: "general productivity beyond where-question forms"
    tier: P0
    note: >-
      closed 2026-08-02 (NV-051) - confirmed general across five noun
      locatives, worth wiring into the engine as a general -chi/-o
      contrast for any noun locative, not just where-question forms
native_notes: >-
  Direct Thangseng quote (paraphrased, relayed via Tridip WhatsApp,
  2026-07-31): "'chi' suffix is movement to locative. 'o' is also
  locative but no movement." Given in response to Tridip's own
  clarifying question about the difference between bano/bachi/bao -
  not a correction of system output, a direct grammar explanation.

  Follow-up, 2026-08-02 (NV-051): "'chi' suffix cannot mean 'at'. chi
  carries a sense of 'motion to'. At is locative 'o'. to the market =
  bajalchi / at the market = bajalo / to the school = skulchi / at the
  school = skulo / at home = noko / to home = nokchi / at the river =
  chibimao / to the river = chibimachi / to the forest = buringchi /
  in the forest = buringo." This is the concrete noun-locative
  evidence that closes the second claim above.

  Follow-up, 2026-08-02 (NV-052, Project Owner direct decision): "it's
  Bajalo close it, market is Bajal and Bajalchi, Skulchi, Nokchi,
  Buringchi are present continuous tense, like i am going to the
  market." Two things closed: (1) the NV-051 'at the market'
  bajaro/bajalo discrepancy resolved in favor of 'bajalo'; 'market'
  itself confirmed spelled 'Bajal', not 'Bajar' (legacy import
  entries corrected). (2) Clarifies that -chi locative phrases like
  Bajalchi/Skulchi/Nokchi/Buringchi canonically appear inside a
  present-continuous "going to X" sentence rather than standing alone
  as a bare "to X" gloss - corroborated by the pre-existing VERIFIED
  sentence "I am going to the market." -> "Anga bajalchi re·angenga."
  This is a pragmatic/register clarification, not a revision of the
  core morphological claim above: -chi remains the movement-to
  locative suffix on the noun; the present-continuous sense comes from
  the paired verb (re·angenga), not from -chi itself.

  Follow-up, 2026-08-03 (NV-054, direct Thangseng native validation
  transcript via Tridip WhatsApp relay): revises this rule's earlier
  characterization of "Bao" as simply a "bare interrogative, no
  locative suffix" synonym of Bano. Direct quote: "Bao is not used for
  places. It is probably a shortened version of bano. It is usually
  used for the placement of objects." Example: "Angni ki·tap bao?" =
  "Where is my book?" This does not touch the -chi/-o movement
  contrast (still verified/high, unaffected), but narrows Bao's actual
  domain: object-location, not general place-interrogative. Separately
  confirms Bano takes directional suffixes not previously documented
  here: -na ("banona" = "where to?") and -ni ("banoni" = "where
  from?", corroborating the -ni sense already embedded in the
  pre-existing sentence "Na·a banoni?" = "Where are you from?"). Not
  yet established whether banona relates to the -chi movement-to
  contrast above or is an independent suffix pattern on bano
  specifically - flagged, not claimed.

  Follow-up, 2026-08-04 (NV-056, direct Thangseng native validation
  transcript via Tridip WhatsApp relay): four new worked examples of
  the banona/banoni suffixes: "Banoni re'baa na'ara?" = "Where did you
  come from?"; "Banoni mandesa iara?" = "Where is this man from?";
  "Ia ki'tapko banona ra'angbo?" = "Where should I take this book to?";
  "Banona re'angbo angara?" = "Where should I go to?" These coexist
  with older unverified legacy sentences for the same English glosses
  that use a different word order and, for "where should I go?", the
  bachi/batchi form instead of banona - not reconciled here, flagged
  for awareness. Separately (not a RULE-044 matter but logged here for
  context): the same relay distinguishes jeon/jeo ("where", relative
  pronoun, NV-054) from a genuinely separate word jean ("which",
  relative pronoun) - see master_dictionary.json new entry.
  Follow-up, 2026-08-10 (direct Thangseng relay via Tridip WhatsApp,
  answering the open Iachi/Uachi-vs-Ianona/Uanona question raised in
  NV-071): "Iachi and Ianona = here, Uachi and Uanona = there. All of
  these are locative, but the 'chi' suffix is directional, they not
  only convey the idea of 'here' and 'there', but also the idea of
  'that side' and 'this side' or the idea of 'towards'... However, the
  translations will be the same in English." Resolves that Iachi/Uachi
  vs. Ianona/Uanona are not competing/conflicting forms: both pairs are
  locative and both translate to plain "here"/"there" in English, but
  -chi specifically carries an additional directional/allative nuance
  ("towards", "this side"/"that side") that Ianona/Uanona do not, which
  English has no separate lexical slot for. Consistent with this rule's
  core -chi=movement-to claim, extended here to deictic here/there with
  an explicit semantic gloss for the nuance beyond bare "movement to X"
  seen in the noun-locative examples above. Does not, on its own,
  resolve the separate open question (NV-054/RULE-044 above) of whether
  "banona"'s -na suffix is the same mechanism as Ianona/Uanona's -na —
  still flagged, not claimed.
