    Closed all 4 open P1 engineering items carried in the migration doc's
    backlog, plus one new systemic issue surfaced while fixing #3:

    1. compiled_dict.json['smile'] fix (NV-067 handoff): root cause
    confirmed -- master_dictionary.json's sole surviving 'Smile' row is
    tagged variant/VERIFIED/HIGH, but its notes explicitly flag its status
    relative to the actually-confirmed word (Ka·dingsmita, under the
    separate 'To smile' key) as unconfirmed; pickPrimary()'s
    master-preference branch can't distinguish that free-text caveat from
    a genuinely-confirmed variant row of identical tag shape ('table' has
    the same bare 'variant/VERIFIED/HIGH' tag but IS the confirmed value)
    -- a first attempt at a generic isVariant-aware fix to pickPrimary
    regressed the table/buy/door SUPERSEDED-precedence tests and was
    reverted before shipping. Landed instead on a narrow, in-pattern
    grammarOverrides entry (same mechanism already used for the
    'right (direction)/(matching)/(correct)' 3-way split) --
    'smile': 'Ka·dingsmita'. compiled_dict.json diff confirmed exactly one
    key changed.

    2. getCategories()/getByCategory() dormancy: root cause --
    getAllVocabulary() built every entry from compiled_dict.json (plain
    strings, no category field), so every entry fell through to the
    'uncategorized' default; real per-word category data existed the
    whole time in category_index.json but was only ever consulted by the
    default-export wrapper's getAllCategories()/getCategoryVocabulary(),
    never by these two raw named exports themselves. Fixed by having
    getAllVocabulary() fall back to CATEGORY_INDEX[english] -- pure wiring
    gap, no new data. Now returns 25 real categories instead of just
    ['uncategorized'].

    3. "she has three children" dropped-classifier bug: root cause --
    grammarEngine.js's object-extraction loop fell straight from a failed
    full-phrase lookup to a bare lastWord lookup ('children' ->
    'Bi·sarang'), discarding any leading number word with no classifier
    applied, even though garo_classifier.js's countNoun()/
    parseCountingPhrase() already handle this correctly on their own.
    Wired the existing classifier engine into the object loop, scoped to
    only fire when no full-phrase lookup already succeeds (so it can
    never silently override an existing dictionary/phrase-map entry).
    This surfaced a much larger, separate, pre-existing data-quality
    problem while testing (see item 5 below).

    4. Build-gate test-file gap: npm run build hardcoded exactly 3 of 6
    tests/unit/*.test.js files to node --test, silently excluding
    number_engine.test.js/rc037_bird_classifier.test.js/
    rong_classifier.test.js (33 tests) from the actual CI gate even though
    npm test already covered them via a glob. Verified all 3 excluded
    files passed standalone before changing anything (so the fix wouldn't
    newly block the build on a pre-existing failure), then switched the
    build script to the same tests/unit/*.test.js glob npm test uses, so
    the two can't drift apart again.

    5. NEW, surfaced this session (not in the original backlog): systemic
    '<number> <noun>' classifier-phrase corruption across ALL categories,
    not just the "she has three dogs" case flagged by the Project Owner
    directly this session with confirmed reference values (two
    dogs=achak mang·gni, three dogs=achak mang·gittam, four
    dogs=achak mang·bri). Audited all 884 '<number> <noun>' entries in
    master_dictionary.json+garo_dictionary.json against
    garo_classifier.js's own already-native-speaker-confirmed
    classifier-composition system and found 413 mismatches spanning every
    classifier category (sak/king/gong/rong/pang, not just mang) -- root
    cause: these are hand-authored literal phrases (OCR imports, early
    manual entries) stored independently of the classifier engine that
    could derive them correctly; RC-CANDIDATE-037 (prior session) had only
    fixed the NOUN substitution for a subset (dog/cat), never re-verified
    the classifier SUFFIX against the actual count, so 'three dogs' was
    still silently wrong (mang·gni, the suffix for TWO) even after that
    fix. Initially shipped as a build-time self-correction pass in
    prepare-data.js (215 entries auto-derived and corrected, commit
    8d2a400) -- then REVERTED after a post-fix git fetch/merge (commit
    00164cb) surfaced that Claude A/Thangseng had independently, natively
    confirmed the exact same dog-count values in parallel
    (docs/THANGSENG_NATIVE_VALIDATION.md NV-071 follow-up #2), but
    explicitly, deliberately left the structurally-identical 'three
    cat'/'two cat' entries untouched pending their OWN native
    confirmation -- 'not touched by that relay', on principle: this
    project's standing discipline is that linguistic values are never
    derived/guessed even when the derivation looks mechanically obvious
    from an already-confirmed system, only entered once explicitly
    confirmed word-by-word. The blanket build-time pass would have
    silently overwritten that restraint on every future build for all 410
    remaining (413 minus the 3 dog keys) mismatches. Deferred to Claude
    A's more conservative approach: reverted the self-correction pass
    (dog values now come directly from Claude A's own confirmed
    master_dictionary.json entries, no code fix needed), took origin's
    version of rc037_bird_classifier.test.js in full, narrowed the new
    translationEngine.test.js regression test from 7 cross-category cases
    down to the 3 genuinely-confirmed dog cases. The remaining 410
    mismatches are a real, live finding, now handed to Claude A as a
    review candidate list (see this session's migration doc) rather than
    shipped as an unreviewed engineering fix -- the underlying mechanism
