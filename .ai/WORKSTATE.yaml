  head_convention: 'PROJECT POLICY (2026-07-31, Project Owner ruling): `head` records repository state
    IMMEDIATELY BEFORE the commit that updates this file - not the commit''s own hash, which cannot be
    known while it is being created. This is intentional, deterministic behavior, not stale metadata.
    Resume procedure: git fetch origin; compare current HEAD against `head`; run `git log --oneline <head>..HEAD`
    to review everything since this checkpoint; continue from actual repo state. Do NOT create follow-up
    commits solely to update `head` to match itself - that is a contradiction (see prior "fix stale head
    hash" commits 9558ea6 etc., now superseded by this convention).'
