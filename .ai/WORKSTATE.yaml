  head_governance_note: '2026-08-13 (Claude A) -- adopted Project Owner governance directive: added Rules
    7 and 8 to the ''Thread hygiene & zero-local-state ground rule'' section of .ai/SESSION_BOOTSTRAP.md,
    immediately after Rule 6. Rule 7: migration documents must state verification SCOPE, not just result
    -- which forms/files/paths, how many of how many, what was intentionally not checked; a passing build/test/repository-intelligence
    run only confirms the existing regression set still passes, not that new/modified behaviour was itself
    executed and inspected -- report that separately. Rule 8: before marking any fix resolved, search
    for every duplicate representation of the same fact (alternate key forms, lookup tables, generated
    artifacts, runtime maps, compile outputs, derived files), verify each reflects the correction, and
    explicitly document any that don''t; until that review is done the fix is provisional, not resolved,
